name: Build Custom Vencord Manager

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "manager/**"
      - ".github/workflows/build-manager.yml"
  push:
    branches: [main]
    paths:
      - "manager/**"
      - ".github/workflows/build-manager.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: manager/WebUi/package-lock.json

      - name: Install frontend dependencies
        working-directory: manager/WebUi
        run: npm ci

      - name: Build React dashboard
        working-directory: manager/WebUi
        run: npm run build

      - name: Build
        run: dotnet build manager\VencordCustomManager.sln -c Release

      - name: Publish single-file Windows build
        run: >-
          dotnet publish manager\VencordCustomManager\VencordCustomManager.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -o manager\publish

      - name: Upload manager artifact
        uses: actions/upload-artifact@v4
        with:
          name: VencordCustomManager-win-x64
          path: manager\publish\VencordCustomManager.exe
          if-no-files-found: error
